name: security-ddl
enabled: true
# kms_region: eu-west-1              # Optional: source KMS CMK region for cross-region decryption
match:
  clusters:
    - "cluster-*"
drop: []
query:
  type: selector
  dimension: command
  value: DROP
output:
  # bucket: secops-audit-vault       # Optional: override default analytical S3 bucket
  # kms_key_id: alias/secops-das-key # Optional: dedicated KMS CMK for this destination bucket
  format: date
  prefix: security-audit
  include_filter: true
