AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Database Activity Stream (DAS) Processor - S3 to SNS to SQS Fanout'

Parameters:
  DasSnsTopicArn:
    Type: String
    Description: 'ARN of the existing SNS Topic that receives S3 Event Notifications from the DAS bucket.'
  
  DasSourceBucketArns:
    Type: CommaDelimitedList
    Description: 'Comma-delimited list of source S3 Bucket ARNs containing the encrypted DAS logs (e.g. "arn:aws:s3:::bucket-1,arn:aws:s3:::bucket-2").'

  DasDestinationBucketName:
    Type: String
    Description: 'Name of the existing destination S3 Bucket for processed Parquet files (DAS_OUTPUT_BUCKET).'

  KmsKeyArn:
    Type: String
    Default: '*'
    Description: 'ARN of the KMS Key used to encrypt the DAS logs, or "*" for multi-account / multi-key setups where KMS key policies govern access.'

  RdsResourceId:
    Type: String
    Default: ''
    Description: 'Optional fallback RDS Resource ID for the encryption context (DAS_RDS_RESOURCE_ID). Dynamically extracted from S3 key if present.'

  DasFiltersDir:
    Type: String
    Default: ''
    Description: 'Optional custom directory path for filter rules (DAS_FILTERS_DIR). Defaults to ${LAMBDA_TASK_ROOT}/filters if left empty.'

  LambdaImageUri:
    Type: String
    Description: 'ECR Image URI for the aws-das-processor Lambda function.'

  LambdaMemorySize:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 1536, 2048, 3072]
    Description: 'Memory size in MB allocated to the Lambda function.'

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: 'Number of days to retain CloudWatch Logs for the Lambda function.'

  LambdaTimeout:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 900
    Description: 'Execution timeout in seconds for the Lambda function.'

  SqsVisibilityTimeout:
    Type: Number
    Default: 720
    MinValue: 60
    MaxValue: 43200
    Description: 'Visibility timeout in seconds for the SQS queue. AWS best practice is at least 6 times the Lambda timeout.'

  SqsBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10
    Description: 'Maximum number of SQS messages to process in a single Lambda invocation (1-10 recommended for DAS payloads).'

  SqsBatchingWindowSeconds:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 300
    Description: 'Maximum time in seconds to gather messages before invoking the function (0 to 300 seconds).'

  SqsMaximumConcurrency:
    Type: Number
    Default: 50
    MinValue: 2
    MaxValue: 1000
    Description: 'Maximum concurrent Lambda invocations triggered by this SQS queue via ScalingConfig.MaximumConcurrency (2 to 1000).'

  SqsMaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: 'The number of times a message is delivered to the processor queue before being moved to the dead-letter queue.'

  LambdaReservedConcurrency:
    Type: Number
    Default: -1
    Description: 'Reserved concurrent executions for the Lambda function. Set to -1 (default) to use the unreserved account concurrency pool, 0 to throttle all invocations, or a positive integer (e.g. 5, 20, 100) to dedicate and cap function concurrency.'

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, -1]]

Resources:
  # 1. Dead-Letter Queue for Fanout
  ProcessorDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true # SQS-managed server-side encryption (works seamlessly with SNS & service principals)

  # 2. SQS Queue for Fanout
  ProcessorQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: !Ref SqsVisibilityTimeout
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true # SQS-managed server-side encryption (works seamlessly with SNS & service principals)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessorDeadLetterQueue.Arn
        maxReceiveCount: !Ref SqsMaxReceiveCount

  # 3. SQS Queue Policy allowing SNS to publish
  ProcessorQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessorQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProcessorQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref DasSnsTopicArn

  # 4. Subscribe SQS to SNS Fanout Topic
  SnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      Endpoint: !GetAtt ProcessorQueue.Arn
      TopicArn: !Ref DasSnsTopicArn
      RawMessageDelivery: false

  # 5. Lambda Execution IAM Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DasProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Split
                  - ','
                  - !Sub
                    - '${inner}/*'
                    - inner: !Join [ '/*,', !Ref DasSourceBucketArns ]
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${DasDestinationBucketName}/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref KmsKeyArn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ProcessorQueue.Arn

  # 6. AWS Lambda Function
  ProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref LambdaImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref LambdaReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          DAS_KMS_REGION_NAME: !Ref AWS::Region
          DAS_RDS_RESOURCE_ID: !Ref RdsResourceId
          DAS_OUTPUT_BUCKET: !Ref DasDestinationBucketName
          DAS_FILTERS_DIR: !Ref DasFiltersDir

  # 7. CloudWatch Log Group with retention policy
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProcessorFunction}'
      RetentionInDays: !Ref LogRetentionDays

  # 8. SQS Event Source Mapping to Lambda
  EventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ProcessorQueue.Arn
      FunctionName: !Ref ProcessorFunction
      BatchSize: !Ref SqsBatchSize
      MaximumBatchingWindowInSeconds: !Ref SqsBatchingWindowSeconds
      ScalingConfig:
        MaximumConcurrency: !Ref SqsMaximumConcurrency
      Enabled: true
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  DestinationBucketName:
    Description: 'S3 Data Lake Bucket for Parquet files'
    Value: !Ref DasDestinationBucketName
  ProcessorFunctionName:
    Description: 'Lambda Function Name'
    Value: !Ref ProcessorFunction
  ProcessorQueueArn:
    Description: 'ARN of the Processing SQS Queue'
    Value: !GetAtt ProcessorQueue.Arn
  ProcessorDLQArn:
    Description: 'ARN of the Dead Letter Queue for failed DAS records'
    Value: !GetAtt ProcessorDeadLetterQueue.Arn
  ProcessorDLQUrl:
    Description: 'URL of the Dead Letter Queue'
    Value: !Ref ProcessorDeadLetterQueue
